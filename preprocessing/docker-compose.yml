services:
  qdrant:
    # Keep in sync with QDRANT_VERSION in host_qdrant.sh and the qdrant-client pin in pyproject.toml.
    image: qdrant/qdrant:v1.10.1
    container_name: qdrant_server
    ports:
      # Qdrant runs without authentication here: publish on localhost only.
      - "127.0.0.1:6333:6333"
      - "127.0.0.1:6334:6334"
    volumes:
      - ./qdrant_storage:/qdrant/storage:z
    restart: always
    environment:
      - QDRANT__SERVICE__ENABLE_STATIC_CONTENT=true
